<svg viewBox="0 0 860 466" width="860" height="466" role="img" aria-label="WH tile byte layout: 32 by 32 int4 weights in 512 bytes" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="wh-tile-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
  <rect x="0" y="0" width="860" height="466" fill="#ffffff"/>
  <text x="20" y="26" font-size="14" fill="#0b0b0b" font-weight="bold">One WH tile: 32 x 32 int4 weights = 1024 nibbles = 512 bytes</text>
  <text x="20" y="56" fill="#52514e">r = input row (k), c = output column (n)</text>
  <rect x="20" y="70" width="256" height="64" fill="#f4efe1" stroke="#8a7f5c" stroke-width="1"/>
  <text x="30" y="98" fill="#0b0b0b">rows 0-7</text>
  <text x="30" y="116" fill="#52514e">→ bytes 0-127</text>
  <rect x="20" y="134" width="256" height="64" fill="#fcfcfb" stroke="#8a7f5c" stroke-width="1"/>
  <text x="30" y="162" fill="#0b0b0b">rows 8-15</text>
  <text x="30" y="180" fill="#52514e">→ bytes 128-255</text>
  <rect x="20" y="198" width="256" height="64" fill="#f4efe1" stroke="#8a7f5c" stroke-width="1"/>
  <text x="30" y="226" fill="#0b0b0b">rows 16-23</text>
  <text x="30" y="244" fill="#52514e">→ bytes 256-383</text>
  <rect x="20" y="262" width="256" height="64" fill="#fcfcfb" stroke="#8a7f5c" stroke-width="1"/>
  <text x="30" y="290" fill="#0b0b0b">rows 24-31</text>
  <text x="30" y="308" fill="#52514e">→ bytes 384-511</text>
  <rect x="236" y="70" width="8" height="64" fill="#8a7f5c" stroke="#8a7f5c"/>
  <text x="196" y="128" font-size="11" fill="#52514e">col c</text>
  <line x1="244" y1="102" x2="330" y2="102" stroke="#8a7f5c" stroke-width="1.5"/>
  <text x="330" y="56" fill="#52514e">column c of one band: 8 weights → 4 bytes</text>
  <rect x="330" y="70" width="60" height="30" fill="#f4efe1" stroke="#8a7f5c" stroke-width="1"/>
  <text x="360" y="90" fill="#0b0b0b" text-anchor="middle">r0</text>
  <rect x="330" y="100" width="60" height="30" fill="#f4efe1" stroke="#8a7f5c" stroke-width="1"/>
  <text x="360" y="120" fill="#0b0b0b" text-anchor="middle">r1</text>
  <rect x="330" y="130" width="60" height="30" fill="#f4efe1" stroke="#8a7f5c" stroke-width="1"/>
  <text x="360" y="150" fill="#0b0b0b" text-anchor="middle">r2</text>
  <rect x="330" y="160" width="60" height="30" fill="#f4efe1" stroke="#8a7f5c" stroke-width="1"/>
  <text x="360" y="180" fill="#0b0b0b" text-anchor="middle">r3</text>
  <rect x="330" y="190" width="60" height="30" fill="#e1e0d9" stroke="#8a7f5c" stroke-width="1"/>
  <text x="360" y="210" fill="#0b0b0b" text-anchor="middle">r4</text>
  <rect x="330" y="220" width="60" height="30" fill="#e1e0d9" stroke="#8a7f5c" stroke-width="1"/>
  <text x="360" y="240" fill="#0b0b0b" text-anchor="middle">r5</text>
  <rect x="330" y="250" width="60" height="30" fill="#e1e0d9" stroke="#8a7f5c" stroke-width="1"/>
  <text x="360" y="270" fill="#0b0b0b" text-anchor="middle">r6</text>
  <rect x="330" y="280" width="60" height="30" fill="#e1e0d9" stroke="#8a7f5c" stroke-width="1"/>
  <text x="360" y="300" fill="#0b0b0b" text-anchor="middle">r7</text>
  <text x="398" y="140" font-size="11" fill="#52514e">r0-r3: low</text>
  <text x="398" y="240" font-size="11" fill="#52514e">r4-r7: high</text>
  <text x="505" y="77" font-size="11" fill="#52514e" text-anchor="middle">high nibble</text>
  <text x="575" y="77" font-size="11" fill="#52514e" text-anchor="middle">low nibble</text>
  <rect x="470" y="82" width="70" height="36" fill="#e1e0d9" stroke="#8a7f5c" stroke-width="1"/>
  <rect x="540" y="82" width="70" height="36" fill="#f4efe1" stroke="#8a7f5c" stroke-width="1"/>
  <text x="505" y="105" fill="#0b0b0b" text-anchor="middle">r4</text>
  <text x="575" y="105" fill="#0b0b0b" text-anchor="middle">r0</text>
  <text x="620" y="105" fill="#0b0b0b">byte 4c + 0</text>
  <rect x="470" y="132" width="70" height="36" fill="#e1e0d9" stroke="#8a7f5c" stroke-width="1"/>
  <rect x="540" y="132" width="70" height="36" fill="#f4efe1" stroke="#8a7f5c" stroke-width="1"/>
  <text x="505" y="155" fill="#0b0b0b" text-anchor="middle">r5</text>
  <text x="575" y="155" fill="#0b0b0b" text-anchor="middle">r1</text>
  <text x="620" y="155" fill="#0b0b0b">byte 4c + 1</text>
  <rect x="470" y="182" width="70" height="36" fill="#e1e0d9" stroke="#8a7f5c" stroke-width="1"/>
  <rect x="540" y="182" width="70" height="36" fill="#f4efe1" stroke="#8a7f5c" stroke-width="1"/>
  <text x="505" y="205" fill="#0b0b0b" text-anchor="middle">r6</text>
  <text x="575" y="205" fill="#0b0b0b" text-anchor="middle">r2</text>
  <text x="620" y="205" fill="#0b0b0b">byte 4c + 2</text>
  <rect x="470" y="232" width="70" height="36" fill="#e1e0d9" stroke="#8a7f5c" stroke-width="1"/>
  <rect x="540" y="232" width="70" height="36" fill="#f4efe1" stroke="#8a7f5c" stroke-width="1"/>
  <text x="505" y="255" fill="#0b0b0b" text-anchor="middle">r7</text>
  <text x="575" y="255" fill="#0b0b0b" text-anchor="middle">r3</text>
  <text x="620" y="255" fill="#0b0b0b">byte 4c + 3</text>
  <text x="470" y="300" fill="#0b0b0b">so a band is col 0 (bytes 0-3), col 1 (4-7),</text>
  <text x="470" y="318" fill="#0b0b0b">... col 31 (124-127) = 128 bytes</text>
  <rect x="20" y="344" width="820" height="108" rx="6" fill="#f6f5f1" stroke="#c3c2b7" stroke-width="1.2"/>
  <text x="32" y="368" fill="#0b0b0b" font-family="Menlo, Consolas, monospace">byte(r, c) = (r / 8) * 128 + c * 4 + (r % 4)</text>
  <text x="32" y="390" fill="#0b0b0b" font-family="Menlo, Consolas, monospace">nibble = (r / 4) % 2  (0 = low)</text>
  <text x="32" y="412" font-size="12" fill="#0b0b0b" font-family="Menlo, Consolas, monospace">tile (kt, nt) of a K x N weight starts at byte (kt * (N / 32) + nt) * 512   (k-major)</text>
  <text x="32" y="436" font-size="12" fill="#52514e">One byte holds two k values of the same output column, four rows apart. Code: whSlot / whPack in nntrainer/tensor/htp_wh_layout.h</text>
</svg>
