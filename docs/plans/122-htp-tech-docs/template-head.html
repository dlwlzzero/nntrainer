<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTP backend — PAGE TITLE</title>
<style>
:root{--bg:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--s1:#2a78d6;--code:#f0efec}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%;scroll-padding-top:3em}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans",Helvetica,Arial,sans-serif;line-height:1.55}
main{max-width:52em;margin:0 auto;padding:0 1em 3em}
nav.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--grid);padding:.5em 1em;font-size:.9em;overflow-x:auto;white-space:nowrap}
nav.top a{margin-right:.9em;color:var(--s1);text-decoration:none}
nav.top a.here{color:var(--ink);font-weight:600}
h1{font-size:1.6em;line-height:1.2;margin:1em 0 .4em}
h2{font-size:1.25em;margin:1.8em 0 .5em;border-bottom:1px solid var(--grid);padding-bottom:.2em}
h3{font-size:1.05em;margin:1.3em 0 .4em}
h4{font-size:1em;margin:1.1em 0 .3em}
h2 a.hd,h3 a.hd,h4 a.hd{color:var(--muted);text-decoration:none;margin-left:.3em;opacity:0}
h2:hover a.hd,h3:hover a.hd,h4:hover a.hd{opacity:1}
p,li{max-width:70ch}
a{color:var(--s1)}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:.88em}
code{background:var(--code);padding:.05em .3em;border-radius:3px;overflow-wrap:anywhere}
pre{background:var(--code);padding:.7em .9em;border-radius:6px;overflow-x:auto;line-height:1.4}
pre code{background:none;padding:0;overflow-wrap:normal}
blockquote{margin:1em 0;padding:.4em 1em;border-left:4px solid var(--s1);background:var(--surface);color:var(--ink2)}
.tablewrap{overflow-x:auto;margin:.8em 0}
table{border-collapse:collapse;font-size:.88em;min-width:100%}
th,td{border-bottom:1px solid var(--grid);padding:.35em .5em;text-align:left;vertical-align:top}
th{color:var(--ink2);font-weight:600;background:var(--surface)}
td[style*=right],th[style*=right]{font-variant-numeric:tabular-nums;white-space:nowrap}
figure{margin:1.2em 0;background:var(--surface);border:1px solid var(--grid);border-radius:8px;padding:.6em;overflow-x:auto}
figure svg{max-width:100%;height:auto;display:block;margin:0 auto}
figcaption{font-size:.85em;color:var(--ink2);margin-top:.4em}
.toc{background:var(--surface);border:1px solid var(--grid);border-radius:8px;padding:.6em 1em;margin:1em 0;font-size:.9em}
.toc ul{margin:.3em 0;padding-left:1.2em}
.toc summary{cursor:pointer;color:var(--ink2);font-weight:600}
.pager{display:flex;justify-content:space-between;gap:1em;margin-top:3em;font-size:.9em}
footer{margin-top:1.5em;font-size:.8em;color:var(--muted);border-top:1px solid var(--grid);padding-top:.6em}
@media (max-width:480px){html{font-size:15px}h1{font-size:1.4em}}
</style>

</head><body>
<!--NAV-->
<main>
